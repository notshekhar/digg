name: release
run-name: release ${{ inputs.tag || github.ref_name }} (by @${{ github.actor }})

on:
    push:
        tags:
            - "v*.*.*"
    workflow_dispatch:
        inputs:
            tag:
                description: "Version tag (e.g. v2.0.0)."
                required: true

permissions:
    contents: write

jobs:
    # ─── Job 1: resolve tag ───────────────────────────────────────────────────
    prepare:
        name: prepare
        runs-on: ubuntu-latest
        outputs:
            tag: ${{ steps.tag.outputs.tag }}
            ver: ${{ steps.tag.outputs.ver }}
        steps:
            - name: Resolve tag + version
              id: tag
              run: |
                  tag="${{ github.event.inputs.tag }}"
                  [ -n "$tag" ] || tag="${GITHUB_REF##*/}"
                  case "$tag" in v*) ;; *) tag="v$tag" ;; esac
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"
                  echo "ver=${tag#v}" >> "$GITHUB_OUTPUT"

    # ─── Job 2: per-target binary build (matrix) ──────────────────────────────
    # digg is pure Go with CGO_ENABLED=0, so every target cross-compiles from a
    # single ubuntu runner — no per-OS runners, no toolchain surprises. The
    # matrix only parallelizes and isolates each target.
    build:
        name: binary (${{ matrix.target }})
        needs: prepare
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { target: darwin-arm64, goos: darwin, goarch: arm64 }
                    - { target: darwin-x64, goos: darwin, goarch: amd64 }
                    - { target: linux-x64, goos: linux, goarch: amd64 }
                    - { target: linux-arm64, goos: linux, goarch: arm64 }
                    - { target: windows-x64, goos: windows, goarch: amd64 }
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: "1.26"
                  cache: true

            - name: Build
              env:
                  CGO_ENABLED: "0"
                  GOOS: ${{ matrix.goos }}
                  GOARCH: ${{ matrix.goarch }}
              run: |
                  ext=""
                  [ "${{ matrix.goos }}" = "windows" ] && ext=".exe"
                  mkdir -p "dist/bin/${{ matrix.target }}"

                  # -s -w drop the symbol table and DWARF: ~30% off a binary
                  # nobody debugs from a release artefact.
                  # -trimpath keeps the builder's absolute paths out of it.
                  go build -trimpath \
                    -ldflags "-s -w -X main.Version=${{ needs.prepare.outputs.ver }}" \
                    -o "dist/bin/${{ matrix.target }}/digg$ext" \
                    ./src/cmd/digg

                  ls -lh "dist/bin/${{ matrix.target }}/digg$ext"

            # install.sh reads this to decide whether an install is current, so
            # it has to keep existing. The tag is the single source of truth for
            # the version — nothing in the repo carries it.
            - name: Stage package.json
              run: |
                  cat > "dist/bin/${{ matrix.target }}/package.json" <<JSON
                  {
                      "name": "digg",
                      "version": "${{ needs.prepare.outputs.ver }}",
                      "description": "digg — a Kubernetes cockpit in your browser."
                  }
                  JSON

            # Layout is <target>/digg + package.json, unchanged from the Bun
            # releases, so an already-installed install.sh keeps working across
            # the rewrite.
            - name: Package
              working-directory: dist/bin
              run: |
                  tar -czf "digg-${{ matrix.target }}.tar.gz" "${{ matrix.target }}"
                  sha256sum "digg-${{ matrix.target }}.tar.gz" > "digg-${{ matrix.target }}.tar.gz.sha256"
                  cat "digg-${{ matrix.target }}.tar.gz.sha256"

            # A binary that cannot start is worth catching before it is published.
            - name: Smoke test (native target only)
              if: matrix.target == 'linux-x64'
              run: |
                  out="$(./dist/bin/${{ matrix.target }}/digg --version)"
                  echo "version reports: $out"
                  [ "$out" = "${{ needs.prepare.outputs.ver }}" ] || {
                    echo "✗ --version printed '$out', expected '${{ needs.prepare.outputs.ver }}'"
                    exit 1
                  }
                  ./dist/bin/${{ matrix.target }}/digg --help > /dev/null

            - name: Upload binary artifact
              uses: actions/upload-artifact@v4
              with:
                  name: bin-${{ matrix.target }}
                  path: |
                      dist/bin/digg-${{ matrix.target }}.tar.gz
                      dist/bin/digg-${{ matrix.target }}.tar.gz.sha256
                  retention-days: 14

    # ─── Job 3: GitHub Release ────────────────────────────────────────────────
    release:
        name: github-release
        needs: [prepare, build]
        runs-on: ubuntu-latest
        steps:
            - name: Download all binary artifacts
              uses: actions/download-artifact@v4
              with:
                  pattern: bin-*
                  path: release
                  merge-multiple: true

            - name: Aggregate SHA256SUMS
              working-directory: release
              run: |
                  : > SHA256SUMS
                  for f in digg-*.tar.gz; do
                    sha256sum "$f" >> SHA256SUMS
                  done
                  cat SHA256SUMS

            - name: Refuse a partial release
              working-directory: release
              run: |
                  count="$(ls digg-*.tar.gz | wc -l)"
                  [ "$count" -eq 5 ] || {
                    echo "✗ expected 5 target tarballs, found $count — not publishing a partial release"
                    ls -l
                    exit 1
                  }

            - name: Create / update GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ needs.prepare.outputs.tag }}
                  name: ${{ needs.prepare.outputs.tag }}
                  generate_release_notes: true
                  files: |
                      release/digg-*.tar.gz
                      release/digg-*.tar.gz.sha256
                      release/SHA256SUMS
