<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="dark light" />
        <title>digg</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap"
        />
        <script>
            // Theme before first paint. serve.ts rewrites the data-theme above
            // from ~/.digg/settings.json; this only covers the dev server and a
            // user who flipped the theme in another tab.
            try {
                const t = localStorage.getItem("digg.theme");
                if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
            } catch {}
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
